<style>

:root{
  --bg: #08120d;
  --bg2: #0f1d15;
  --panel: #13241b;
  --green: #39ff5a;
  --green2: #25d84c;
  --white: #ffffff;
  --muted: #b9c4bc;
  --border: rgba(57,255,90,.20);
  --shadow: 0 0 30px rgba(57,255,90,.15);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  background:var(--bg);
  color:var(--white);
  font-family:'Inter',sans-serif;
  line-height:1.7;
}
  
a{
  text-decoration:none;
}

.container{
  width:min(1200px,92%);
  margin:auto;
}

section{
  padding:90px 0;
}

h1,h2,h3{
  line-height:1.2;
}

h1{
  font-size:4rem;
}

h2{
  font-size:2.4rem;
  margin-bottom:20px;
}

h3{
  font-size:1.4rem;
  margin-bottom:12px;
}

p{
  color:var(--muted);
}

.btn{
  display:inline-block;
  padding:14px 28px;
  border-radius:12px;
  font-weight:700;
  transition:.25s;
}

.btn-primary{
  background:var(--green);
  color:#000;
}

.btn-primary:hover{
  transform:translateY(-2px);
}
  }

.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:18px;
  padding:30px;
}

header{
  position:sticky;
  top:0;
  z-index:50;

  background:rgba(8,18,13,.92);
  backdrop-filter:blur(12px);

  border-bottom:1px solid rgba(255,255,255,.08);
}

.nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px 0;
}

.logo{
  display:flex;
  gap:12px;
  align-items:center;
  font-weight:800;
}

.logo img{
  width:48px;
  height:48px;
}

.nav-links{
  display:flex;
  gap:24px;
}

.nav-links a{
  color:white;
}

.hero{
  background:
  radial-gradient(circle at center,
  rgba(57,255,90,.12),
  transparent 45%);

  padding:120px 0 100px;
}

.hero-grid{
  display:grid;
  grid-template-columns:1.1fr .9fr;
  gap:50px;
  align-items:center;
}

.hero h1{
  margin-bottom:20px;
}
